name: Gradle Build and Docker Push

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Grant execute permissions to gradlew
        run: chmod +x ./gradlew

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '1.8'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: takoosh808
          password: Luke0104Leia$

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: takoosh808/javatest:latest
